<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" role="img" aria-label="Túi mua sắm chrome">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".18" stop-color="#c4cad4"/><stop offset=".36" stop-color="#6c7484"/><stop offset=".52" stop-color="#f4f6fa"/><stop offset=".7" stop-color="#9aa3b2"/><stop offset=".86" stop-color="#2d3443"/><stop offset="1" stop-color="#c4cad4"/>
    </linearGradient>
