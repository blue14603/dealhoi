<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Minh họa thẻ tín dụng kim loại">
  <defs>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/><stop offset=".16" stop-color="#b9c0cc"/><stop offset=".34" stop-color="#5d6575"/><stop offset=".5" stop-color="#dfe3ea"/><stop offset=".66" stop-color="#8a93a3"/><stop offset=".84" stop-color="#2d3443"/><stop offset="1" stop-color="#c4cad4"/>
    </linearGradient>
    <linearGradient id="cob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#416dff"/><stop offset=".5" stop-color="#1a3fc4"/><stop offset="1" stop-color="#08123d"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9aa3b2"/><stop offset="1" stop-color="#e3e7ee"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#416dff"/><stop offset=".45" stop-color="#a9c7ff" stop-opacity=".1"/><stop offset="1" stop-color="#ffffff" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2457ff" stop-opacity=".55"/><stop offset="1" stop-color="#2457ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="front"><rect x="0" y="0" width="340" height="214" rx="22"/></clipPath>
    <pattern id="lines" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="6" height="6" fill="none"/><path d="M0 0 V6" stroke="#ffffff" stroke-opacity=".06"/></pattern>
  </defs>
  <circle cx="300" cy="220" r="210" fill="url(#glow)"/>
  <ellipse cx="290" cy="430" rx="200" ry="16" fill="url(#shadow)"/>
  <!-- back card: cobalt glass -->
  <g transform="translate(206 70) rotate(14)">
    <rect width="300" height="189" rx="20" fill="url(#cob)"/>
    <rect width="300" height="189" rx="20" fill="url(#lines)"/>
    <rect width="300" height="189" rx="20" fill="none" stroke="#a9c7ff" stroke-opacity=".45" stroke-width="1.5"/>
    <rect x="24" y="140" width="90" height="8" rx="4" fill="#a9c7ff" fill-opacity=".5"/>
  </g>
  <!-- front card: brushed titanium -->
  <g transform="translate(70 150) rotate(-9)">
    <rect width="340" height="214" rx="22" fill="url(#ti)"/>
    <g clip-path="url(#front)">
      <rect width="340" height="214" fill="url(#lines)"/>
      <rect x="-60" y="-40" width="70" height="320" fill="url(#sweep)" transform="rotate(24)"/>
    </g>
    <rect width="340" height="214" rx="22" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <!-- chip -->
    <rect x="30" y="74" width="50" height="38" rx="8" fill="url(#chip)" stroke="#5d6575"/>
    <path d="M30 93 H80 M55 74 V112 M42 74 V86 M68 100 V112" stroke="#5d6575" stroke-width="1.2"/>
    <!-- contactless -->
    <g fill="none" stroke="#2d3443" stroke-width="3" stroke-linecap="round">
      <path d="M104 82 Q112 93 104 104"/><path d="M114 76 Q126 93 114 110"/><path d="M124 70 Q140 93 124 116"/>
    </g>
    <!-- abstract number blocks (no real numbers) -->
    <g fill="#2d3443" fill-opacity=".55"><rect x="30" y="148" width="44" height="9" rx="4.5"/><rect x="84" y="148" width="44" height="9" rx="4.5"/><rect x="138" y="148" width="44" height="9" rx="4.5"/><rect x="192" y="148" width="44" height="9" rx="4.5"/></g>
    <rect x="30" y="176" width="90" height="7" rx="3.5" fill="#2d3443" fill-opacity=".4"/>
    <circle cx="282" cy="176" r="15" fill="#2457ff" fill-opacity=".85"/><circle cx="302" cy="176" r="15" fill="#c4cad4" fill-opacity=".7"/>
  </g>
  <!-- sparkle -->
  <path d="M470 96 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5 l15 -5 z" fill="#ffffff" opacity=".9"/>
  <path d="M110 110 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" fill="#a9c7ff" opacity=".8"/>
</svg>
