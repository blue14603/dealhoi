<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" role="img" aria-label="Điện thoại thông minh">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/><stop offset=".25" stop-color="#8a93a3"/><stop offset=".5" stop-color="#e3e7ee"/><stop offset=".72" stop-color="#5d6575"/><stop offset="1" stop-color="#c4cad4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1230"/><stop offset=".55" stop-color="#132a8a"/><stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#a9c7ff"/><stop offset=".4" stop-color="#2457ff"/><stop offset="1" stop-color="#2457ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimb" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#416dff"/><stop offset=".5" stop-color="#a9c7ff" stop-opacity=".1"/><stop offset="1" stop-color="#ffffff" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="scr"><rect x="78" y="44" width="120" height="250" rx="22"/></clipPath>
  </defs>
  <ellipse cx="132" cy="322" rx="84" ry="10" fill="url(#shadow)"/>
  <g transform="rotate(-14 138 170)">
    <!-- side thickness -->
    <rect x="76" y="40" width="132" height="262" rx="30" fill="#4a5262"/>
    <!-- titanium frame -->
    <rect x="70" y="36" width="136" height="266" rx="30" fill="url(#frame)"/>
    <rect x="70" y="36" width="136" height="266" rx="30" fill="none" stroke="url(#rimb)" stroke-width="2.5"/>
    <!-- screen -->
    <rect x="78" y="44" width="120" height="250" rx="22" fill="url(#screen)"/>
    <g clip-path="url(#scr)">
      <circle cx="120" cy="150" r="110" fill="url(#orb)" opacity=".85"/>
      <path d="M60 250 C110 200 150 260 220 190 V320 H60 Z" fill="#2457ff" opacity=".35"/>
      <path d="M60 270 C120 230 160 280 220 230" stroke="#a9c7ff" stroke-opacity=".5" stroke-width="1.5" fill="none"/>
      <rect x="40" y="40" width="40" height="300" fill="url(#sheen)" transform="rotate(18 60 190)"/>
      <!-- abstract UI -->
      <rect x="94" y="208" width="88" height="34" rx="12" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".25"/>
      <rect x="104" y="218" width="40" height="5" rx="2.5" fill="#f4f6fa" fill-opacity=".8"/>
      <rect x="104" y="228" width="26" height="5" rx="2.5" fill="#b9f568"/>
    </g>
    <!-- island -->
    <circle cx="138" cy="60" r="5.5" fill="#05060a" stroke="#2d3443" stroke-width="1.5"/>
    <!-- buttons -->
    <rect x="205" y="108" width="4" height="40" rx="2" fill="#8a93a3"/>
    <rect x="67" y="96" width="4" height="22" rx="2" fill="#8a93a3"/>
    <rect x="67" y="126" width="4" height="36" rx="2" fill="#8a93a3"/>
  </g>
</svg>
